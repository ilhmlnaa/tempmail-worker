<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/legacy/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        const theme = window.localStorage.getItem('theme') || 'legacy'
        const colorMode = window.localStorage.getItem('color-mode') || 'dark'
        document.documentElement.dataset.theme = theme
        document.documentElement.classList.toggle('dark', colorMode === 'dark')
      } catch (error) {
        document.documentElement.dataset.theme = 'legacy'
        document.documentElement.classList.add('dark')
      }
    </script>
    <title>VoidMail Admin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
